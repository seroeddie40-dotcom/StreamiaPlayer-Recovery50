name: Streamia Player - Android Debug APK and checks

"on":
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: streamia-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Analyze, Test and Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show environment
        run: |
          flutter --version
          flutter doctor -v

      # Flutter includes its own Gradle build. Give that included build Maven Central
      # as well as the plugin portal for Kotlin compiler artifacts.
      - name: Configure Gradle repositories for included Flutter build
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.gradle/init.d"
          cat > "$HOME/.gradle/init.d/streamia-repositories.gradle" <<'GRADLE'
          gradle.beforeSettings { settings ->
              settings.pluginManagement.repositories {
                  mavenCentral()
                  google()
                  gradlePluginPortal()
              }
          }
          gradle.settingsEvaluated { settings ->
              settings.pluginManagement.repositories {
                  mavenCentral()
                  google()
                  gradlePluginPortal()
              }
          }
          gradle.beforeProject { project ->
              project.buildscript.repositories {
                  mavenCentral()
                  google()
                  gradlePluginPortal()
              }
          }
          GRADLE
          echo "Configured Gradle init script for all builds, including Flutter's included build."

      - name: Restore and validate permanent debug signing key
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "::error::Missing GitHub secret DEBUG_KEYSTORE_BASE64"
            exit 1
          fi
          mkdir -p "$HOME/.android"
          printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          keytool -list -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android > "$RUNNER_TEMP/streamia-keystore-info.txt"
          python3 - <<'PY'
          import os, re, sys
          text = open(os.path.join(os.environ['RUNNER_TEMP'], 'streamia-keystore-info.txt'), encoding='utf-8').read()
          m = re.search(r'^\s*SHA256:\s*([0-9A-Fa-f:]+)\s*$', text, re.M)
          expected = 'B22C52AB21AD649755CFDD8F2302C2A9CB5DADC13409B1BD373E941C9FBBF8F2'
          actual = re.sub(r'[^0-9A-Fa-f]', '', m.group(1)).upper() if m else None
          if actual != expected:
              print('::error::Restored keystore fingerprint does not match the permanent Streamia key')
              sys.exit(1)
          print('Permanent Streamia signing key verified:', expected)
          PY

      - name: Validate Android project
        run: |
          if [ -f scripts/check_android_package.py ]; then
            python3 scripts/check_android_package.py
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Flutter project
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run Flutter tests
        run: flutter test

      - name: Build signed debug APK
        run: |
          flutter build apk \
            --debug \
            --build-number=${{ github.run_number }}

      - name: Verify APK signature matches permanent key
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-debug.apk
          test -s "$APK"
          BUILD_TOOLS="$(ls -1 "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          APKSIGNER="$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/streamia-apk-signature.txt"
          python3 - <<'PY'
          import os, re, sys
          text = open(os.path.join(os.environ['RUNNER_TEMP'], 'streamia-apk-signature.txt'), encoding='utf-8').read()
          expected = 'B22C52AB21AD649755CFDD8F2302C2A9CB5DADC13409B1BD373E941C9FBBF8F2'
          digests = re.findall(r'^\s*(?:Signer\s*#\d+|V\d+\s+Signer):\s*certificate SHA-256 digest:\s*([0-9A-Fa-f:]+)\s*$', text, re.M | re.I)
          actual = {re.sub(r'[^0-9A-Fa-f]', '', digest).upper() for digest in digests}
          if actual != {expected}:
              print('::error::APK signing certificate mismatch or certificate digest not found. Observed:', sorted(actual))
              sys.exit(1)
          print('APK signing certificate matches the permanent Streamia key.')
          PY
          ls -lh "$APK"

      - name: Upload Streamia Player APK
        uses: actions/upload-artifact@v4
        with:
          name: streamia-player-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
