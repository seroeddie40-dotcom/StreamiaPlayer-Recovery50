
name: Streamia Player - Android Debug APK and checks

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: streamia-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Analyze, Test and Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show environment
        run: |
          flutter --version
          flutter doctor -v

      - name: Restore permanent debug signing key
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          if [ -z "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "::error::Missing GitHub secret DEBUG_KEYSTORE_BASE64"
            exit 1
          fi

          mkdir -p "$HOME/.android"

          printf '%s' "$DEBUG_KEYSTORE_BASE64" \
            | base64 --decode \
            > "$HOME/.android/debug.keystore"

          chmod 600 "$HOME/.android/debug.keystore"

          keytool -list \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android > /dev/null

          echo "Permanent debug signing key restored."

      - name: Validate Android project
        run: |
          if [ -f scripts/check_android_package.py ]; then
            python3 scripts/check_android_package.py
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Flutter project
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run Flutter tests
        run: flutter test

      - name: Build signed debug APK
        run: |
          flutter build apk \
            --debug \
            --build-number=${{ github.run_number }}

      - name: Verify APK
        run: |
          test -s build/app/outputs/flutter-apk/app-debug.apk

          ls -lh \
            build/app/outputs/flutter-apk/app-debug.apk

          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner" \
            verify --verbose \
            build/app/outputs/flutter-apk/app-debug.apk

      - name: Upload Streamia Player APK
        uses: actions/upload-artifact@v4
        with:
          name: streamia-player-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
