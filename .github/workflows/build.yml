
name: Streamia Player - Android Debug APK and checks

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show environment
        run: flutter doctor -v

      - name: Verify Android package structure
        run: python3 scripts/check_android_package.py

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      # Diagnose: Testdateien unabhängig voneinander ausführen.
      # Fehler stoppen diese Diagnoseschritte nicht, damit
      # wir die Ergebnisse beider Dateien erhalten.
      - name: Diagnose TV keyboard widget tests
        id: keyboard_widget
        continue-on-error: true
        run: |
          flutter test test/tv_keyboard_widget_test.dart \
            --reporter expanded --concurrency=1

      - name: Diagnose TV keyboard navigation tests
        id: keyboard_navigation
        continue-on-error: true
        run: |
          flutter test test/tv_keyboard_confirm_navigation_test.dart \
            --reporter expanded --concurrency=1

      # Alle Tests bleiben verpflichtend.
      - name: Run all Flutter tests
        run: flutter test --reporter expanded

      - name: Build installable debug APK
        run: flutter build apk --debug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: streamia-player-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
